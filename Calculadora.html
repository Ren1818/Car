<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carta Secreta</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fce4ec;
    }
    .screen {
      display: none;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .active {
      display: flex;
    }
    .password-screen {
      flex-direction: column;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }
    .key {
      background-color: #f8bbd0;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      padding: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .key:hover {
      background-color: #f48fb1;
    }
    .input-display {
      font-size: 24px;
      margin-top: 20px;
      letter-spacing: 8px;
    }
    .notepad {
      background-color: #fff0f6;
      border: 3px solid #f8bbd0;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      text-align: left;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      line-height: 1.6;
    }
    .notepad h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>

<div id="passwordScreen" class="screen password-screen active">
  <h2>🔒 Adivina el Password </h2>
 <h3>Pista "dos numeros"</h3>
  <div class="input-display" id="inputDisplay">••••</div>
  <div class="keypad">
    <button class="key" onclick="enterDigit('1')">1</button>
    <button class="key" onclick="enterDigit('2')">2</button>
    <button class="key" onclick="enterDigit('3')">3</button>
    <button class="key" onclick="enterDigit('4')">4</button>
    <button class="key" onclick="enterDigit('5')">5</button>
    <button class="key" onclick="enterDigit('6')">6</button>
    <button class="key" onclick="enterDigit('7')">7</button>
    <button class="key" onclick="enterDigit('9')">9</button>
    <button class="key" onclick="enterDigit('8')">8</button>
    <div></div>
    <button class="key" onclick="enterDigit('0')">0</button>
    <div></div>
  </div>
</div>

<div id="notepadScreen" class="screen">
  <div class="notepad">
    <a href="index.html" class="nav-button">Mirar</a>
  </div>
</div>

<style>
  .nav-button {
    display: inline-block;
    padding: 10px 20px;
    background-color: #eb5dab; /* Color para combinar con tu diseño */
    color: #ffffff;
    text-decoration: none;
    margin: 0px auto;
    text-align: center;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.95rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    transition: background-color 0.3s ease, transform 0.2s ease;
}

/* Efecto al pasar el cursor */
.nav-button:hover {
    background-color: #ec1894;
    transform: translateY(-2px);
}
.lyrics-container {
    max-width: 500px;
    margin: 0px auto;
    text-align: center;
}
</style>

<script>
  const correctPassword = '15';
  let input = '';

  function enterDigit(digit) {
    if (input.length < 2) {
      input += digit;
    }

    const display = document.getElementById('inputDisplay');
    display.textContent = input.padEnd(2, '•');

    if (input.length === 2) {
      if (input === correctPassword) {
        document.getElementById('passwordScreen').classList.remove('active');
        document.getElementById('notepadScreen').classList.add('active');
      } else {
        alert('Contraseña incorecta, intenta de nuevo');
        input = '';
        display.textContent = '••••';
      }
    }
  }
</script>

</body>
</html>
